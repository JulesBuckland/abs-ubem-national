[pytest]
# Without testpaths, a bare "pytest" collects from the repository root and walks
# every sibling directory. In a working checkout that includes data/raw/physics
# (~500,000 EnergyPlus run files) and .venv, so collection appears to hang. Both
# the README and CI invoke pytest with no path argument, so this has to be set.
testpaths = tests

norecursedirs =
    .git
    .venv
    .hypothesis
    .pytest_cache
    __pycache__
    archive
    data
    docs
    logs
    manuscript
    outputs
    papers
    tests/fixtures

# Show skip reasons by default: the suite skips the tests needing licensed
# fixtures or R-INLA, and a green run should say so rather than look complete.
addopts = -ra
