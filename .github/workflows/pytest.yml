name: E2E Pipeline and Unit Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Unit Tests (SOLID/Scala Verification)
      run: |
        pytest tests/unit/

    - name: Run Component/Integration Tests (real, non-mocked statistical cores)
      env:
        TEST_MODE: "1"
      run: |
        pytest tests/integration/

    - name: Run E2E Fixture Pipeline (Physical Bounds Verification)
      env:
        TEST_MODE: "1"
      run: |
        pytest tests/test_e2e_pipeline.py

    - name: Run Golden Baseline Test (cross-stage regression check)
      env:
        TEST_MODE: "1"
      run: |
        pytest tests/test_golden.py
